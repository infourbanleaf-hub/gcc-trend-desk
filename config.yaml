# GCC Trend Desk configuration. Edit this file on GitHub (pencil icon) to change what is tracked.
# Nothing secret goes here: tokens live in GitHub "Secrets" (see SETUP.md).

# Google Sheet "Product Discovery Tracker" (the long ID in its URL).
sheet_id: 12pNC_wBEwh2Wmptbve9O2fEkZbTA0gM33YQ4FkJ3sTM

# Meta Graph API version used for Instagram and Marketing API calls.
graph_version: v23.0

instagram:
  # Instagram allows 30 different hashtags per rolling 7 days per account.
  # Keep the total below 28 so there is room for a test. No '#', no spaces.
  # Starting list - replace freely with what your team sees working.
  hashtags:
    # Shopping and offer tags only: city tags (دبي, الرياض, الكويت ...) mostly returned news and politics.
    UAE: [dubaishopping, uaeshopping, تسوق_دبي, منتجات_مفيدة, عروض_الامارات]
    Saudi Arabia: [السعودية_تسوق, تسوق_اونلاين, ksashopping, عروض_السعودية, الدفع_عند_الاستلام, متجر_الكتروني]
    Kuwait: [kuwaitshopping, تسوق_الكويت, عروض_الكويت, منتجات_الكويت]
    Qatar: [qatarshopping, عروض_قطر, تسوق_قطر]
    Oman: [omanshopping, عروض_عمان]
  # Posts older than this are removed from the "Instagram Pulse" tab (3 weekly runs).
  keep_days: 21

  # Gulf online shops to track with Business Discovery (public business/creator accounts only).
  # Exact Instagram usernames, without '@'. Example format:
  #   - {username: someshop.ae, country: UAE}
  shops:
    # Verified with Business Discovery on 1 Nov 2026. Big Gulf marketplaces, modest-fashion shops and Indian brands selling to the Gulf.
    - {username: namshi, country: UAE}
    - {username: noon_uae, country: UAE}
    - {username: noon, country: Saudi Arabia}
    - {username: splashfashions, country: UAE}
    - {username: centrepointme, country: UAE}
    - {username: maxfashionmena, country: UAE}
    - {username: brandsforless, country: UAE}
    - {username: vogacloset, country: UAE}
    - {username: modanisa, country: UAE}
    - {username: ounass, country: UAE}
    - {username: desertcart, country: UAE}
    - {username: danubehome, country: UAE}
    - {username: mumzworld, country: UAE}
    - {username: boutiqaat, country: Kuwait}
    - {username: arabianoud, country: Saudi Arabia}
    - {username: ajmalperfumes, country: UAE}
    - {username: bibaindia, country: India (ships to GCC)}
    - {username: kalkifashion, country: India (ships to GCC)}

meta_audience:
  # Meta ad account number (digits only) is stored as the secret META_AD_ACCOUNT_ID.
  # Each term is matched to Meta's closest interest; the matched name is shown in the sheet.
  # Terms with no Meta interest are skipped (Oud, Foot care and Home organisation had none on 20 Oct 2026).
  countries: {UAE: AE, Saudi Arabia: SA, Qatar: QA, Oman: OM, Kuwait: KW}
  interests:
    # The shortlisted product lines (Candidates tab), so audience growth speaks to what we may sell.
    - Hijab
    - Abaya
    - Shawl
    - Kurta
    - Cushion
    - Costume jewelry
    - Back pain
    - Sunglasses

trade:
  # HS codes (4-digit customs product groups) for the product types on the wall. India -> GCC exports.
  years: [2023, 2024, 2025]
  hs:
    "6107": Men's underwear & sleepwear (knit) - briefs, vests, sirwal
    "6109": T-shirts & vests (knit)
    "6115": Socks & hosiery
    "6104": Women's suits, dresses, skirts (knit) - kurta sets
    "6204": Women's suits, dresses, skirts (woven) - kaftans, abayas
    "6211": Track suits & other garments (woven) - abayas, kimonos
    "6214": Shawls, scarves, stoles, hijabs
    "6212": Corsets, braces, shapewear
    "6217": Clothing accessories
    "6307": Other made-up textiles - organisers, car shades
    "6304": Furnishing articles - cushion covers
    "4202": Bags, travel & toiletry cases
    "7117": Imitation jewellery
