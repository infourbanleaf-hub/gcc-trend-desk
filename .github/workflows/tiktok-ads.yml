name: TikTok Top Ads (weekly)
on:
  schedule:
    - cron: "7 7 * * 1"   # Monday 11:07 Gulf time / 12:37 IST, before the 14:07 IST dashboard export
  workflow_dispatch: {}
jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python -m trenddesk tiktok
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
