name: Amazon + Google Trends via Apify (weekly)
on:
  schedule:
    - cron: "17 6 * * 1"   # Monday 10:17 Gulf time / 11:47 IST, before the 14:07 IST dashboard export
  workflow_dispatch: {}
jobs:
  apifymarket:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m trenddesk apifymarket
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
