name: Find Gulf shops (check Instagram usernames)
on:
  workflow_dispatch:
    inputs:
      guesses:
        description: "Comma-separated Instagram usernames to check"
        required: true
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m trenddesk findshops
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SHOP_GUESSES: ${{ github.event.inputs.guesses }}
