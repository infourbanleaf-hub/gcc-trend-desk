name: TikTok hashtag videos via Apify (weekly)
on:
  schedule:
    - cron: "37 6 * * 1"   # Monday 10:37 Gulf time / 12:07 IST, before the 14:07 IST dashboard export
  workflow_dispatch: {}
jobs:
  tthashtags:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Skip quietly until the Apify key is added
        id: key
        run: if [ -z "$APIFY_TOKEN" ]; then echo "::notice title=TikTok hashtags::APIFY_TOKEN secret not set yet - skipped"; echo "skip=1" >> $GITHUB_OUTPUT; fi
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - if: steps.key.outputs.skip != '1'
        run: python -m trenddesk tthashtags
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
