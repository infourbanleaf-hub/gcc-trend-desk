name: Dashboard export (pictures + data)
on:
  schedule:
    - cron: "37 8 * * 1"   # Monday 12:37 Gulf time / 14:07 IST, after the sheet's Monday imports
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pillow==10.4.0
      - name: Google Product Taxonomy (global category standard)
        run: curl -sSf https://www.google.com/basepages/producttype/taxonomy-with-ids.en-US.txt -o dashboard/google_taxonomy.txt || echo "taxonomy download failed; keeping the saved copy"
      - run: python -m trenddesk export
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: List demand-without-ads products for the Monday ad check
        run: python dashboard/build_wall.py . /tmp/products.json && python -m trenddesk adgaps
        env:
          PRODUCTS_JSON: /tmp/products.json
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Commit export
        run: |
          git config user.name "trend-desk-bot"
          git config user.email "trend-desk-bot@users.noreply.github.com"
          git add dashboard && git add -f dashboard/data.json dashboard/trade.json dashboard/audience.json dashboard/shipping.json dashboard/adgap_checks.json dashboard/history
          git commit -m "Dashboard export $(date -u +%F)" || echo "nothing to commit"
          git push
