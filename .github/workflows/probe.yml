name: Probe (one-off)
on:
  workflow_dispatch:
    inputs:
      check: { description: "actors to inspect", required: false, default: "" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python scripts/apify_probe.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CHECK: ${{ github.event.inputs.check }}
